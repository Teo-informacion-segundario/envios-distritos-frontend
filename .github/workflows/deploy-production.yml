name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: envios-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: easypanel/envios/web:${{ github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Confirmar que este commit sigue siendo main
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "Workflow SHA: $GITHUB_SHA"
          echo "Main actual:   $MAIN_SHA"
          if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
            echo "Deploy omitido: este workflow pertenece a un commit obsoleto."
            exit 0
          fi
          echo "DEPLOY_CURRENT_MAIN=true" >> "$GITHUB_ENV"

      - name: Validar secretos requeridos
        if: env.DEPLOY_CURRENT_MAIN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Falta VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Falta VPS_USER"; exit 1; }
          test -n "$VPS_SSH_KEY_B64" || { echo "Falta VPS_SSH_KEY_B64"; exit 1; }

      - name: Preparar SSH
        if: env.DEPLOY_CURRENT_MAIN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Verificar VPS y Docker Swarm
        if: env.DEPLOY_CURRENT_MAIN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            docker info >/dev/null
            NODE_COUNT=$(docker node ls -q | wc -l | tr -d " ")
            if [ "$NODE_COUNT" != "1" ]; then
              echo "Deploy detenido: este workflow esta preparado para un Swarm de un solo nodo. Nodos detectados: $NODE_COUNT"
              exit 1
            fi
            docker service inspect envios_web >/dev/null
          '

      - name: Construir imagen
        if: env.DEPLOY_CURRENT_MAIN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t "$IMAGE" .

      - name: Transferir imagen al VPS
        if: env.DEPLOY_CURRENT_MAIN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker save "$IMAGE" | gzip -1 | ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'gunzip | docker load'

      - name: Confirmar main nuevamente antes de publicar
        if: env.DEPLOY_CURRENT_MAIN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "Workflow SHA: $GITHUB_SHA"
          echo "Main actual:   $MAIN_SHA"
          if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
            echo "Deploy cancelado antes de publicar: main cambio durante el build."
            exit 1
          fi

      - name: Actualizar servicio envios_web
        if: env.DEPLOY_CURRENT_MAIN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" "
            set -euo pipefail
            docker service update \
              --image '$IMAGE' \
              --force \
              --detach=false \
              envios_web
            docker service inspect envios_web \
              --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'
          "

      - name: Verificar despliegue
        if: env.DEPLOY_CURRENT_MAIN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            RUNNING=$(docker service ps envios_web --filter desired-state=running --format "{{.CurrentState}}" | grep -c "Running" || true)
            if [ "$RUNNING" -lt 1 ]; then
              echo "El servicio envios_web no quedo en Running"
              docker service ps envios_web --no-trunc
              exit 1
            fi
            docker service ps envios_web --no-trunc | head -n 6
          '
